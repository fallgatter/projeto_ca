<section id="grafo-curitiba">
  <header class="grafo-head">
    <h1>Grafo dirigido do Quadrilátero de Curitiba</h1>
    <p class="text-small text-muted"><span data-counts>Carregando a rede SUMO…</span></p>
  </header>
  <div class="grafo-toolbar">
    <div class="grafo-legend text-small" aria-label="Legenda">
      <span><i class="grafo-line" style="--mark: var(--blue)" aria-hidden="true"></i> Presidente Kennedy</span>
      <span><i class="grafo-line" style="--mark: var(--green)" aria-hidden="true"></i> Sete de Setembro</span>
      <span><i class="grafo-line" style="--mark: var(--purple)" aria-hidden="true"></i> Marechal Floriano Peixoto</span>
      <span><i class="grafo-node" aria-hidden="true"></i> Nó semaforizado</span>
    </div>
    <div class="viz-row" aria-label="Zoom">
      <button class="btn" type="button" data-zoom="out" aria-label="Diminuir zoom">−</button>
      <button class="btn" type="button" data-zoom="in" aria-label="Aumentar zoom">+</button>
    </div>
  </div>
  <div class="grafo-map">
    <svg class="cursor-interaction" role="img" aria-label="Mapa da rede motorizada do SUMO. As setas apontam do nó de origem para o nó de destino de cada trecho." aria-describedby="grafo-curitiba-help"></svg>
  </div>
  <p id="grafo-curitiba-help" class="text-small text-muted">Arraste o mapa para mover. Aproxime para ver mais setas e selecione um trecho para inspecionar suas saídas.</p>
  <div class="grafo-selection">
    <p data-detail class="text-small tabular-nums" aria-live="polite"></p>
    <label class="form-label"><span>Saídas permitidas</span><select class="form-select" data-turn disabled></select></label>
  </div>
</section>
<style>
  #grafo-curitiba { display: grid; gap: calc(var(--font-size-base) * .6); }
  #grafo-curitiba .grafo-head { display: grid; gap: calc(var(--font-size-base) * .25); }
  #grafo-curitiba .grafo-toolbar, #grafo-curitiba .grafo-selection {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: calc(var(--font-size-base) * .5);
  }
  #grafo-curitiba .grafo-legend { display: flex; flex-wrap: wrap; gap: .3em 1em; }
  #grafo-curitiba .grafo-legend span { display: inline-flex; align-items: center; gap: .35em; }
  #grafo-curitiba .grafo-line { width: 1.2em; height: 2px; background: var(--mark); }
  #grafo-curitiba .grafo-node { width: .5em; height: .5em; border-radius: 50%; background: var(--foreground); }
  #grafo-curitiba .grafo-map { position: relative; height: clamp(260px, 56vw, 525px); min-width: 0; }
  #grafo-curitiba svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #grafo-curitiba svg[data-drag] { cursor: grabbing; }
  #grafo-curitiba .grafo-selection > p { flex: 1 1 280px; overflow-wrap: anywhere; }
  #grafo-curitiba .grafo-selection label { max-width: 100%; flex: 1 1 215px; }
  #grafo-curitiba .grafo-selection select { width: 100%; }
</style>

<script>
(async () => {
  const root = document.getElementById('grafo-curitiba');
  const svg = root.querySelector('svg');
  const mapFrame = root.querySelector('.grafo-map');
  const namespace = 'http://www.w3.org/2000/svg';
  const counts = root.querySelector('[data-counts]');
  const detail = root.querySelector('[data-detail]');
  const turnSelect = root.querySelector('[data-turn]');
  const probe = document.createElement('span');
  probe.hidden = true;
  root.append(probe);
  const numbers = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
  const format = number => numbers.format(number);
  const modeLabel = mask => mask === 3 ? 'carros e ônibus' : mask === 1 ? 'carros' : 'ônibus';

  try {
    const packed = document.getElementById('grafo-curitiba-data').textContent.trim();
    const bytes = Uint8Array.from(atob(packed), letter => letter.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const { bounds, nodes, roads, edges: records, initial } = await new Response(stream).json();
    const [west, south, east, north] = bounds;
    const edges = records.map(([id, from, to, road, length, speed, modes, rank, corridor, shape, turns], index) => {
      const legs = [];
      let distance = 0;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let offset = 0; offset < shape.length; offset += 2) {
        const x = shape[offset], y = shape[offset + 1];
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        if (offset === 0) continue;
        const a = shape[offset - 2], b = shape[offset - 1];
        const dx = x - a, dy = y - b, len = Math.hypot(dx, dy);
        if (!len) continue;
        legs.push({ x: a, y: b, dx, dy, len, at: distance });
        distance += len;
      }
      return { index, id, from, to, name: roads[road], length, speed, modes, rank, corridor, shape, turns, legs, distance,
        box: [minX, minY, maxX, maxY] };
    });
    counts.textContent = `${format(nodes.length)} nós · ${format(edges.length)} trechos dirigidos para carros ou ônibus`;

    let width = 0, height = 0, fit = 0;
    let centerX = (west + east) / 2, centerY = (south + north) / 2, zoom = 1;
    let selected = edges[initial], colors = [], scheduled = false, drag = null;
    const themeColor = (token, fallback) => {
      probe.style.color = `var(${token}, ${fallback})`;
      return getComputedStyle(probe).color;
    };
    function theme() {
      colors = [themeColor('--muted-foreground', 'GrayText'), themeColor('--foreground', 'CanvasText'),
        themeColor('--blue', 'LinkText'), themeColor('--green', 'CanvasText'), themeColor('--purple', 'VisitedText'),
        themeColor('--background', 'Canvas'), themeColor('--orange', 'Highlight')];
      requestDraw();
    }
    const scale = () => fit * zoom;
    const screen = (x, y) => [(x - centerX) * scale() + width / 2, (centerY - y) * scale() + height / 2];
    const world = (x, y) => [centerX + (x - width / 2) / scale(), centerY - (y - height / 2) / scale()];
    const inside = (box, view) => box[0] <= view[2] && box[2] >= view[0] && box[1] <= view[3] && box[3] >= view[1];

    function pointAt(edge, at) {
      const leg = edge.legs.find(part => part.at + part.len >= at) ?? edge.legs.at(-1);
      if (!leg) return null;
      const ratio = (at - leg.at) / leg.len;
      return [leg.x + ratio * leg.dx, leg.y + ratio * leg.dy, leg.dx / leg.len, -leg.dy / leg.len];
    }
    const xy = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;
    function trace(edge) {
      let path = `M${xy(...screen(edge.shape[0], edge.shape[1]))}`;
      for (let offset = 2; offset < edge.shape.length; offset += 2) {
        path += `L${xy(...screen(edge.shape[offset], edge.shape[offset + 1]))}`;
      }
      return path;
    }
    function arrow(edge, at, size) {
      const point = pointAt(edge, at);
      if (!point) return '';
      const [x, y] = screen(point[0], point[1]);
      const [, , dx, dy] = point;
      const a = xy(x - size * dx - size * .58 * dy, y - size * dy + size * .58 * dx);
      const b = xy(x - size * dx + size * .58 * dy, y - size * dy - size * .58 * dx);
      return `M${a}L${xy(x, y)}L${b}`;
    }
    function circle(x, y, radius) {
      return `M${xy(x + radius, y)}a${radius},${radius} 0 1,0 ${-2 * radius},0a${radius},${radius} 0 1,0 ${2 * radius},0z`;
    }
    function mark(type, attrs, label) {
      const element = document.createElementNS(namespace, type);
      for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
      if (label) element.textContent = label;
      return element;
    }
    function line(path, color, weight, opacity = 1) {
      return mark('path', { d: path, fill: 'none', stroke: color, 'stroke-width': weight,
        'stroke-opacity': opacity, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    }
    function draw() {
      scheduled = false;
      if (!fit || !colors.length) return;
      const sx = scale();
      const [left, bottom] = world(-12, height + 12), [right, top] = world(width + 12, -12);
      const region = [left, bottom, right, top];
      const groups = [[], [], [], [], []];
      for (const edge of edges) {
        if (inside(edge.box, region)) groups[edge.corridor || (edge.rank ? 1 : 0)].push(edge);
      }
      const scene = document.createDocumentFragment();
      groups.forEach((group, index) => {
        let path = '';
        for (const edge of group) {
          path += trace(edge);
          if (edge.distance * sx >= (index >= 2 ? 12 : 23) && (index >= 2 || zoom > 1.7)) {
            path += arrow(edge, edge.distance * .58, index >= 2 ? 5 : 4);
          }
        }
        scene.append(line(path, colors[index], [0.85, 1.05, 2, 2, 2][index], [0.35, 0.54, 0.96, 0.96, 0.96][index]));
      });

      let junctions = '';
      for (const [, x, y, signal] of nodes) {
        if (x < left || x > right || y < bottom || y > top) continue;
        if (!signal && zoom < 3) continue;
        junctions += circle(...screen(x, y), signal ? (zoom < 2 ? 1.35 : 2.1) : 1.45);
      }
      scene.append(mark('path', { d: junctions, fill: colors[1], opacity: zoom < 2 ? .42 : .78 }));

      if (selected && inside(selected.box, region)) {
        const path = trace(selected);
        const [, ax, ay] = nodes[selected.from], [, bx, by] = nodes[selected.to];
        scene.append(line(path, colors[5], 5), line(path + arrow(selected, selected.distance * .68, 9), colors[6], 2.8),
          line(circle(...screen(ax, ay), 3.5), colors[6], 1.6),
          mark('path', { d: circle(...screen(bx, by), 3), fill: colors[6] }));
      }

      const bar = [2000, 1000, 500, 250, 100, 50, 25, 10].find(value => value * sx < 95) ?? 10;
      const northArrow = `M${width - 17},27v15M${width - 22},32l5,-5 5,5`;
      scene.append(line(`M10,${height - 12}h${bar * sx}` + northArrow, colors[1], 1.25),
        mark('text', { x: 10, y: height - 17, fill: colors[1] }, `${format(bar)} m`),
        mark('text', { x: width - 22, y: 23, fill: colors[1] }, 'N'));
      svg.replaceChildren(scene);
    }
    function requestDraw() {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(draw);
    }
    function resize() {
      const bounds = mapFrame.getBoundingClientRect();
      if (bounds.width === width && bounds.height === height) return;
      width = bounds.width; height = bounds.height;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      fit = Math.min((width - 30) / (east - west), (height - 28) / (north - south));
      requestDraw();
    }
    function inspect(edge) {
      selected = edge;
      const origin = nodes[edge.from][0], destination = nodes[edge.to][0];
      const speed = edge.speed.length === 1 ? format(edge.speed[0]) : edge.speed.map(format).join('–');
      detail.textContent = `${edge.name || 'Trecho sem nome'} · ${edge.id} · ${origin} → ${destination} · ${format(edge.length)} m · ${speed} km/h · ${modeLabel(edge.modes)}`;
      turnSelect.replaceChildren(new Option(edge.turns.length ? `${edge.turns.length} a partir do nó de destino` : 'Nenhuma saída neste grafo', ''));
      for (const [index, modes] of edge.turns) {
        const next = edges[index];
        turnSelect.add(new Option(`${next.name || 'Trecho sem nome'} · ${next.id} · ${modeLabel(modes)}`, index));
      }
      turnSelect.disabled = !edge.turns.length;
      requestDraw();
    }
    function save() {
      window.openai?.setWidgetState?.({ modelContent: { trecho: selected.id, via: selected.name },
        privateContent: { index: selected.index, centerX, centerY, zoom } })?.catch(() => {});
    }
    function restore(state) {
      if (!state || !edges[state.index] || ![state.centerX, state.centerY, state.zoom].every(Number.isFinite)) return;
      centerX = state.centerX; centerY = state.centerY; zoom = state.zoom;
      inspect(edges[state.index]);
    }
    function zoomAt(factor, x, y) {
      const [targetX, targetY] = world(x, y);
      zoom = Math.max(.8, Math.min(24, zoom * factor));
      centerX = targetX - (x - width / 2) / scale();
      centerY = targetY + (y - height / 2) / scale();
      requestDraw(); save();
    }
    function pick(x, y) {
      const [wx, wy] = world(x, y);
      const buffer = 8 / scale();
      const region = [wx - buffer, wy - buffer, wx + buffer, wy + buffer];
      let best = null, distance = buffer * buffer;
      for (const edge of edges) {
        if (!inside(edge.box, region)) continue;
        for (const leg of edge.legs) {
          const dx = wx - leg.x, dy = wy - leg.y;
          const at = Math.max(0, Math.min(1, (dx * leg.dx + dy * leg.dy) / (leg.len * leg.len)));
          const d = (dx - at * leg.dx) ** 2 + (dy - at * leg.dy) ** 2;
          if (d < distance) { distance = d; best = edge; }
        }
      }
      if (best) { inspect(best); save(); }
    }

    for (const button of root.querySelectorAll('[data-zoom]')) {
      button.addEventListener('click', () => zoomAt(button.dataset.zoom === 'in' ? 1.5 : 1 / 1.5, width / 2, height / 2));
    }
    svg.addEventListener('wheel', event => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      const rect = svg.getBoundingClientRect();
      zoomAt(Math.exp(Math.max(-1, Math.min(1, -event.deltaY * .006))), event.clientX - rect.left, event.clientY - rect.top);
    }, { passive: false });
    svg.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      drag = { x: event.clientX, y: event.clientY, centerX, centerY, moved: false };
      svg.setPointerCapture(event.pointerId);
    });
    svg.addEventListener('pointermove', event => {
      if (!drag || !event.isPrimary) return;
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      drag.moved = true;
      centerX = drag.centerX - dx / scale(); centerY = drag.centerY + dy / scale();
      svg.setAttribute('data-drag', ''); requestDraw();
    });
    svg.addEventListener('pointerup', event => {
      if (!drag || !event.isPrimary) return;
      const rect = svg.getBoundingClientRect();
      if (drag.moved) save(); else pick(event.clientX - rect.left, event.clientY - rect.top);
      drag = null; svg.removeAttribute('data-drag');
    });
    svg.addEventListener('pointercancel', () => { drag = null; svg.removeAttribute('data-drag'); });
    turnSelect.addEventListener('change', () => {
      if (!turnSelect.value) return;
      const edge = edges[Number(turnSelect.value)];
      const [left, bottom, right, top] = edge.box;
      centerX = (left + right) / 2; centerY = (bottom + top) / 2;
      zoom = Math.max(zoom, 4);
      inspect(edge); save();
    });
    theme(); resize(); inspect(selected);
    restore(window.openai?.widgetState?.privateContent);
    draw();
    window.addEventListener('openai:set_globals', event => { restore(event.detail?.globals?.widgetState?.privateContent); theme(); });
    new ResizeObserver(resize).observe(mapFrame);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
  } catch (error) {
    counts.textContent = 'Não foi possível carregar a rede.';
    counts.setAttribute('role', 'alert');
    console.error(error);
  }
})();
</script>
